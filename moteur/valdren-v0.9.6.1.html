<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'épreuve de Valdren</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Bureau : fiche du héros | scène | ce que le monde sait. Téléphone : bandeau collant, la scène, puis la fiche, puis le monde. */
:root{
  color-scheme:dark;
  --bg:#0f1512; --panel:#161e1a; --panel2:#1d2722; --line:#2b3a32;
  --fg:#e6e9e3; --muted:#9aa89f;
  --gold:#e3c27a; --ember:#e8825a; --steel:#8fc3e8; --night:#a99be0;
  --ok:#7fd29a; --mid:#e0b45c; --bad:#e07a6c;
  /* ---- Réglages des volets (mobile, sous 940 px) : modifiez ces valeurs ---- */
  --volet-largeur:82vw;      /* part de l'écran occupée par un volet ouvert */
  --volet-max:440px;         /* plafond de largeur, pour les tablettes */
  --volet-teinte:20%;        /* part de la couleur du liseret dans le fond du volet */
  --voile-opacite:.55;       /* assombrissement de l'écran principal (0 = aucun, 1 = noir) */
  --voile-flou:2px;          /* flou de l'écran principal derrière le volet */
  --liseret-epaisseur:8px;   /* épaisseur de la poignée (v0.8.51 : 5px) */
  --liseret-trait:0;         /* trait sur toute la hauteur de l'écran : 0 = invisible (v0.8.52 : .85) ; remettre .3 pour un trait discret */
  --liseret-poignee:64px;    /* hauteur de la poignée, seule partie visible */
  --liseret-zone:24px;       /* largeur sensible au doigt, invisible, sur toute la hauteur */
  --seuil-glisser:30%;       /* repère : part de la largeur à tirer pour ouvrir ou refermer (réglée dans le script : SEUIL) */
  --liseret-gauche:#e3c27a;  /* votre héros : or */
  --liseret-droite:#8fc3e8;  /* ce que le monde sait, rumeurs : acier */
  --display:"Fraunces",Georgia,serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;padding:16px}
body.nuit{background:#0c1016}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;border-bottom:1px solid var(--line);padding-bottom:10px}
header h1{font-size:1.7rem}
.eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.clock{font-family:var(--mono);font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock b{color:var(--gold);font-weight:500}
.days{display:flex;gap:3px;flex-wrap:wrap;max-width:190px}
.days i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.days i.past{background:var(--muted)}.days i.cur{background:var(--gold)}
.mini{display:none;font-family:var(--mono);font-size:.8rem;gap:12px;flex-wrap:wrap}
.mini b{color:var(--gold);font-weight:500}
.grid{display:grid;grid-template-columns:270px 1fr 300px;grid-template-areas:"fiche main monde";gap:14px;align-items:start}
.p-fiche{grid-area:fiche}.p-main{grid-area:main}.p-monde{grid-area:monde}
.pane-in{display:flex;flex-direction:column;gap:12px;min-width:0}
.liseret,.voile,.fermer{display:none}
@media(max-width:940px){
  .grid{grid-template-columns:1fr;grid-template-areas:"main"}
  .pane.p-fiche,.pane.p-monde{position:fixed;top:0;bottom:0;z-index:40;width:var(--volet-largeur);max-width:var(--volet-max);overflow-y:auto;overscroll-behavior:contain;border-radius:0;padding:14px 16px 28px;transition:transform .25s ease,visibility .25s;visibility:hidden}
  .pane.p-fiche{left:0;transform:translateX(-102%);border:0;border-right:2px solid var(--liseret-gauche);background:color-mix(in srgb,var(--liseret-gauche) var(--volet-teinte),var(--panel))}
  .pane.p-monde{right:0;transform:translateX(102%);border:0;border-left:2px solid var(--liseret-droite);background:color-mix(in srgb,var(--liseret-droite) var(--volet-teinte),var(--panel))}
  body.ouvert-g .pane.p-fiche,body.ouvert-d .pane.p-monde{transform:none;visibility:visible}
  body.ouvert-g,body.ouvert-d{overflow:hidden}
  .voile{display:block;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,var(--voile-opacite));backdrop-filter:blur(var(--voile-flou));-webkit-backdrop-filter:blur(var(--voile-flou));opacity:0;pointer-events:none;transition:opacity .25s}
  body.ouvert-g .voile,body.ouvert-d .voile{opacity:1;pointer-events:auto}
  .liseret{display:block;position:fixed;top:0;bottom:0;z-index:20;width:var(--liseret-zone);padding:0;border:0;background:none;cursor:grab;touch-action:none;transition:transform .25s ease}
  body.ouvert-g .liseret.g{transform:translateX(min(var(--volet-largeur),var(--volet-max)));z-index:45}
  body.ouvert-d .liseret.d{transform:translateX(calc(-1 * min(var(--volet-largeur),var(--volet-max))));z-index:45}
  body.glisse .pane.p-fiche,body.glisse .pane.p-monde,body.glisse .liseret,body.glisse .voile{transition:none}
  body.glisse{user-select:none;-webkit-user-select:none}
  .liseret.g{left:0}.liseret.d{right:0}
  .liseret::before{content:"";position:absolute;top:0;bottom:0;width:var(--liseret-epaisseur);opacity:var(--liseret-trait)}
  .liseret.g::before{left:0;background:var(--liseret-gauche)}.liseret.d::before{right:0;background:var(--liseret-droite)}
  .liseret::after{content:"";position:absolute;top:50%;width:calc(var(--liseret-epaisseur) + 4px);height:var(--liseret-poignee);margin-top:calc(var(--liseret-poignee) / -2);opacity:.9}
  .liseret.g::after{left:0;background:var(--liseret-gauche);border-radius:0 6px 6px 0}.liseret.d::after{right:0;background:var(--liseret-droite);border-radius:6px 0 0 6px}
  .fermer{display:flex;align-items:center;justify-content:center;position:sticky;top:0;margin:-4px -6px 0 auto;z-index:2;width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:1.4rem;line-height:1}
  .p-monde .scroll{max-height:none;overflow:visible}
  header{position:sticky;top:0;z-index:5;background:var(--bg);margin:-16px -16px 0;padding:10px 16px}
  body.nuit header{background:#0c1016}
  header h1{font-size:1.25rem}
  .mini{display:flex}
  .days{display:none}
}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:12px}
.pane h2{font-size:1.15rem}
.muted{color:var(--muted)}.small{font-size:.85rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gauge{display:flex;flex-direction:column;gap:3px}
.gauge .lab{display:flex;justify-content:space-between;font-size:.82rem}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bar.pv i{background:var(--ok)}.bar.foe i{background:var(--ember)}.bar.renom i{background:var(--steel)}
.bar .tick{position:absolute;top:0;bottom:0;width:2px;background:var(--bg)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:var(--panel2);border-radius:8px;padding:6px 10px}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:1.05rem}
.stat span{font-size:.75rem;color:var(--muted)}
.niv{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.niv b{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--gold);font-weight:500}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{font-size:.86rem;border-left:2px solid var(--line);padding-left:8px}
.item b{font-weight:600}.item.rare{border-color:var(--ember)}.item.guilde{border-color:var(--steel)}.item.nuit{border-color:var(--night)}
.traits{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:.84rem}
.pips{display:flex;gap:3px}.pips i{width:14px;height:6px;border-radius:2px;background:var(--line)}.pips i.on{background:var(--gold)}
.pill{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:1px 8px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.pill.bad{color:var(--bad);border-color:var(--bad)}.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.mid{color:var(--mid);border-color:var(--mid)}
.pill.wrap{white-space:normal;border-radius:8px}
.pill.ember{color:var(--ember);border-color:var(--ember)}.pill.steel{color:var(--steel);border-color:var(--steel)}.pill.night{color:var(--night);border-color:var(--night)}
.lieu{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--panel2)}
.lieu.dragon{border-left:3px solid var(--ember)}.lieu.fort{border-left:3px solid var(--steel)}.lieu.village{border-left:3px solid var(--gold)}.lieu.bois{border-left:3px solid var(--ok)}.lieu.nuitl{border-left:3px solid var(--night)}
.lieu h3{font-size:1.2rem}
.acts{display:flex;flex-direction:column;gap:6px}
.act{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;transition:border-color .15s}
.act:hover:not(:disabled){border-color:var(--gold)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .t{font-weight:600}
.act .d{grid-column:1/-1;font-size:.83rem;color:var(--muted)}
.act .c{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-align:right}
.btn{background:var(--gold);color:#1a1508;border:0;border-radius:8px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel2);display:flex;flex-direction:column;gap:10px}
.card.ok{border-color:var(--ok)}.card.mid{border-color:var(--mid)}.card.bad{border-color:var(--bad)}.card.gold{border-color:var(--gold)}.card.night{border-color:var(--night)}
.card h2{font-size:1.4rem}
.card.ok h2{color:var(--ok)}.card.mid h2{color:var(--mid)}.card.bad h2{color:var(--bad)}.card.gold h2{color:var(--gold)}.card.night h2{color:var(--night)}
.card p{max-width:66ch}
.origines{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.origine{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.origine:hover{border-color:var(--gold)}
.origine b{font-family:var(--display);font-size:1.15rem;font-weight:500;color:var(--gold)}
.origine span{font-size:.85rem;color:var(--muted)}
.warn{padding:10px 12px;border-radius:8px;border:1px solid var(--bad);background:#2a1512;font-size:.92rem}
.foe{display:flex;flex-direction:column;gap:6px}
.foe .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.foe h2{font-size:1.5rem}
.clog{display:flex;flex-direction:column;gap:4px;font-size:.92rem;min-height:3.2em;border-left:2px solid var(--line);padding-left:10px}
.clog .you{color:var(--gold)}.clog .them{color:var(--ember)}.clog .tell{color:var(--mid);font-weight:600}.clog .good{color:var(--ok)}.clog .ally{color:var(--steel)}.clog .muted{color:var(--muted)}
.intent{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem;display:flex;flex-direction:column;gap:2px}
.intent b{color:var(--mid)}
.cbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cbtns .act{grid-template-columns:1fr}
table.xp{border-collapse:collapse;width:100%;font-size:.9rem}
table.xp td{padding:4px 0;border-bottom:1px solid var(--line)}
table.xp td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.xp tr.tot td{border-bottom:0;font-weight:600;color:var(--gold)}
.learn{background:#2a2410;border:1px solid #5a4c2a;border-radius:8px;padding:8px 12px;font-size:.9rem}
.learn b{color:var(--gold)}
.learn ul{margin:4px 0 0;padding-left:18px}
.tscroll{overflow-x:auto}
table.cmp{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
table.cmp th{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:400;padding:4px 12px 4px 0;white-space:nowrap}
table.cmp td{padding:6px 12px 6px 0;border-top:1px solid var(--line);white-space:nowrap}
table.cmp tr.cur td{color:var(--gold)}
.journal li{font-size:.85rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.journal li.rum{color:var(--steel)}.journal li.bad{color:var(--bad)}.journal li.good{color:var(--ok)}.journal li.nuit{color:var(--night)}
.journal li small{color:var(--muted);font-family:var(--mono);font-size:.7rem;margin-right:6px}
.scroll{max-height:320px;overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.86rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
footer{color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.portrait{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:4px}
.portrait img{width:104px;height:104px;border-radius:8px;border:2px solid var(--steel);background:radial-gradient(circle at 35% 25%,#2a2f3d,#14161d);object-fit:cover;box-shadow:inset 0 0 0 1px #0008}
.portrait span{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.withp{display:flex;gap:12px;align-items:flex-start}.withp>div:last-child{flex:1;min-width:0}
.lnk{background:none;border:0;color:var(--steel);text-decoration:underline;padding:0;font-size:.82rem;text-align:left}
button.pill{background:transparent;color:var(--fg);cursor:pointer}button.pill:disabled{opacity:.4;cursor:not-allowed}
.champ{font:inherit;font-size:.85rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;min-width:0}
.champ:focus{outline:2px solid var(--gold);outline-offset:1px}
h3.sujet{font-size:1.05rem;color:var(--gold);margin-top:6px}
li.info{border-left:2px solid var(--line);padding:6px 0 6px 10px;display:flex;flex-direction:column;gap:5px}
li.info.ret{border-color:var(--gold)}
.journal li.info{color:var(--gold)}
.verite{font-family:var(--mono);font-size:.72rem}.verite.v{color:var(--ok)}.verite.f{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Chroniques des Failles · banc d'essai v0.9.6.1 · dernière version · Monde vivant · Journal d'intelligence</div>
      <h1>L'épreuve de Valdren</h1>
    </div>
    <div class="clock" id="clock"></div>
    <div class="mini" id="mini"></div>
  </header>
  <div class="grid">
    <section class="pane p-fiche" id="volet-g" aria-label="Votre personnage"><button class="fermer" data-tiroir="fermer" aria-label="Fermer le volet">×</button><div class="pane-in" id="fiche"></div></section>
    <section class="pane p-main" id="main" aria-live="polite"></section>
    <section class="pane p-monde" id="volet-d" aria-label="Ce que le monde sait"><button class="fermer" data-tiroir="fermer" aria-label="Fermer le volet">×</button><div class="pane-in" id="monde"></div></section>
  </div>
  <button class="liseret g" data-tiroir="g" aria-label="Ouvrir la fiche de votre héros"></button>
  <button class="liseret d" data-tiroir="d" aria-label="Ouvrir ce que le monde sait, et les rumeurs"></button>
  <div class="voile" data-tiroir="fermer"></div>
  <footer><span>Prototype de test. La question posée : un joueur faible mais observateur réussit-il là où un joueur fort mais imprudent échoue ?</span><button data-a="rejouer">Recommencer la partie</button></footer>
</div>
<script>
// ---------- RÈGLES (aucun accès à la page : testables seules) ----------
const JOURS=35, CAP=3, DIM=[1,.6,.35,.2], CALME=3;
const NOM_DRAGON="Azharel", NOM_CREATURE="Le Veilleur d’écorce, un Morghal";
// Morghal reste une silhouette sans nom tant que personne (Azharel) ne l'a nommé. Son niveau n'est jamais affiché tel quel.
const morghalNomme=()=>!!(S.camp&&S.camp.morghalNomme);
const creatureNom=()=>morghalNomme()?NOM_CREATURE:"La créature aux bois noirs";
const creatureCourt=()=>morghalNomme()?"Morghal":"la créature";
function impressionMorghal(){ const d=Math.max(22,varekNiv()+2)-S.niv+7; /* 2,5× PV et seconde phase */ return d>=8?"Elle vous dépasse de très loin.":d>=3?"Elle vous dépasse nettement.":d>=-2?"Un combat à égalité, peut-être.":"Vous pourriez la tenir, au prix d'un long combat."; }
// Banc d'essai : en partie normale, profil de Varek et informateur sont tirés au hasard et cachés au joueur.
let BANC={ouvert:false,doctrine:"aleatoire",espion:"aleatoire",profil:"aucun",graine:""};
const hashStr=s=>{ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const mulberry=a=>()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const nouvelleGraine=()=>Math.random().toString(36).slice(2,8).toUpperCase();
// Ceux qui connaissent les dates de départ d'Orsan : l'un d'eux renseigne Varek.
const SUSPECTS={aubergiste:{nom:"l'aubergiste du Gué",Nom:"L'aubergiste du Gué",adj:false,fait:"L'aubergiste prépare les provisions d'Orsan la veille de chaque départ."},
  sergent:{nom:"le sergent de garde",Nom:"Le sergent de garde",adj:false,fait:"Le sergent de garde tient le registre des portes : il sait quand Orsan quitte le Gué."},
  maelys:{nom:"Maëlys",Nom:"Maëlys",adj:true,fait:"Maëlys reçoit les ordres de mission d'Orsan pour organiser la relève."},
  darian:{nom:"Darian",Nom:"Darian",adj:true,fait:"Darian a servi sous les ordres de Varek avant sa radiation, et ne l'a jamais renié."},
  ysolde:{nom:"Ysolde, la messagère",Nom:"Ysolde, la messagère",adj:false,fait:"Ysolde porte les plis de la Guilde et les bons de commande des artisans : elle connaît les départs d'Orsan comme les convois d'Ivan."}};
const ADJ=["maelys","darian"], CONFIDENTS=["orsan","maelys","darian","sergent","aubergiste","ysolde"];
const NOMS_P={varek:"Varek",orsan:"Orsan",ivan:"Ivan",hilda:"Hilda",aubergiste:"l'aubergiste du Gué",sergent:"le sergent de garde",maelys:"Maëlys",darian:"Darian",ysolde:"Ysolde",milicien:"un milicien du fort",azharel:"Azharel",selena:"Séléna",kael:"Kael"};
const aNom=k=>{ const n=NOMS_P[k]; return n.startsWith("le ")?"au "+n.slice(3):"à "+n; };
const Maj=t=>t.charAt(0).toUpperCase()+t.slice(1);
const SUJETS={failles:"Ce qui marche la nuit",varek:"Qui est Varek ?",fuite:"La fuite",guilde:"La Guilde",fort:"Le fort de Varek"};
const VILLAGE_K={ivan:"forgeron",hilda:"guerisseuse",aubergiste:"aubergiste"};
const DRAGON={niv:150,pvMax:3000,def:150,soin:120,recule:.12,grace:.35};
const SEUILS=[30,55,80];
const FORET_SEUIL=6, DOMINE=.7;
// v02 : rejoue les règles de combat et de niveaux de la v0.2 (mesure de référence).
const K={rip:2,ripG:2.5,blk:.5,blkG:.3,lu:1.25,alea:.15,chefPv:1.15,attJ:10,pvJ:60,v02:false};
const VAREK=[
  {niv:22,prep:"Aucune préparation. Il ne sait pas que vous existez."},

function xpGarnison(n,pourquoi){ const G=S.garnison; G.xp=Math.max(0,G.xp+n);

function tentativeRapt(){ const V=S.varek; if(!peutRapt()){ dire(V.rapts>=2?"Varek juge les enlèvements supplémentaires inutiles : sa guerre se porte désormais vers les Guildes.":"Les éclaireurs de Varek renoncent à leur coup de main : la réputation des académiciens et les sentinelles les dissuadent.","good"); return; }
  let k=V.dernierRapt==="forgeron"?"guerisseuse":"forgeron";
  const pret=S.convoi&&S.jour>=S.convoi.jour+3; /* contact à J+1, puis 48 h de préparation */ if(k==="forgeron"&&!pret){ if(V.dernierRapt!=="guerisseuse"&&!pris("guerisseuse")) k="guerisseuse"; else { dire("Les éclaireurs de Varek rôdent sans frapper. Ils attendent quelque chose.","rum"); return; } }
  if(k==="forgeron"&&S.convoi) S.convoi.rapt=S.jour;
  if(pris(k)){ dire("Les chasseurs de Varek surveillent les chemins, sans pouvoir surprendre leur nouvelle cible.","rum"); return; }
  V.captifs.push(k); V.rapts++; V.dernierRapt=k; V.capJour[k]=S.jour;
  dire(k==="forgeron"?"Ivan a été intercepté sur la route des minerais, loin du village. Varek l'oblige à travailler pour sa milice ; chaque jour de captivité renforce son arsenal.":"Hilda a été capturée en cueillant des plantes hors des murs. Varek veut ses remèdes pour ses hommes.","bad");
  if(k==="forgeron") dire(doctrinal()?"On le dit traité avec égards : Varek a le minerai de Bram, mais il lui faut un maître pour le travailler. Il respecte l'art d'Ivan.":"On dit qu'au fort, les apprentis forgerons travaillent double sous les ordres d'Ivan. Certains s'effondrent, d'autres passent la nuit au cachot. Ivan, lui, est ménagé, tant qu'on a besoin de lui.","rum");
  if(espionActif()&&missionJourUn()) addInfo({id:"pattern",sujet:"fuite",texte:"Les hommes de Varek ont frappé au premier jour de la mission d'Orsan. Ils savaient qu'il partait.",source:"Votre observation",vrai:true}); }

  const k=V.captifs.find(x=>S.jour-(V.capJour[x]||S.jour)>=4); if(!k||Math.random()>.4) return; G.tente=true;

const acad=()=>S.origine==="acad";

const pvMax=()=>Math.round(pvMaxOf(S.niv)*(1+.07*tl("tenacite")));
function attJ(){ const A=ARMES[S.arme]; let a=(attOf(S.niv)+3*Math.max(0,S.armes[S.arme])+(S.obj.croc?10:0)+(S.obj.griffe?8:0)+(S.obj.venin?6:0)+(S.obj.lameNuit?6:0)+(S.obj.lameVarek?5:0)+(S.obj.donAzharel?8:0)+(S.obj.lameOrsan?5:0))*A.att*(1+.04*dextR(S.arme))*(1+affinite2(S.arme)+((S.trempe||{})[S.arme]?.05:0))*(1+.08*tl("force"))*(S.blessure>0?.8:1);
  if(S.pv<pvMax()*.3) a*=1+.1*tl("volonte"); return Math.round(a); }
function defJ(){ const c=S.scene&&S.scene.c; let d=defOf(S.niv)+Math.max([0,12,18][Math.min(2,S.obj.cuirasse)],S.obj.plastron?26:0); if(c&&c.kind==="rival"&&c.sousEstime) d*=.5; if(S.arme==="dague") d*=.8; return Math.round(d); }

function gagnerXP(x,cap){ cap=Infinity; /* v0.8.7.2 : la prise de risque n'est jamais plafonnée */ x=Math.round(x*(S.motivation?1.15:1)); let n=0,perdu=0; S.xp+=x;
  while(S.xp>=xpNeed(S.niv)){ if(n>=cap){ perdu=S.xp-(xpNeed(S.niv)-1); S.xp=xpNeed(S.niv)-1; break; }
    S.xp-=xpNeed(S.niv); S.niv++; n++; S.pv+=7; }
  return {total:x,n,perdu}; }

function matin(){
  if(S.route){ S.renom=clamp(S.renom+S.route,0,100);S.route=0;dire("Les rumeurs de la veille sont arrivées. Renom : "+S.renom+" / 100."); }
  const cible=Math.min(3,SEUILS.filter(s=>S.renom>=s).length+S.varek.direct);
  while(cible>S.varek.stage){S.varek.stage++;dire(RUMEURS_VAREK[S.varek.stage],"rum");}
  nouvellesGuilde();if(!S.varek.vaincu){artisansCaptifs();initiativeGarnison();}evenementsInfos();resoudreConfidences();raidGuildeMatin();livrerCommande();convoiMatin();piegeMatin();agentMatin();varekMatin();relacheMatin();convocMatin();verifMatin();disparitionMatin();epilogueMatin();enqueteMatin();
  const D=S.dragon;
  if(!D.mort){ D.pv=Math.min(DRAGON.pvMax,D.pv+DRAGON.soin);D.calme++;
    if(D.calme>=CALME&&D.mefiance>0){D.mefiance--;D.calme=0;dire("Le dragon ne vous a pas revu depuis "+CALME+" jours : il baisse un peu sa garde.");} }
  if(!D.mort&&!D.pacte&&D.agressions>=3){const k=Object.keys(OTAGES).find(x=>!ferme(x));D.agressions=0;if(k)S.village[k]=S.jour+2;S.renom=clamp(S.renom-10,0,100);dire("Le dragon est descendu sur Valdren : les habitants se terrent. Renom −10.","bad");}
  if(S.nuit.interdictionEntr>0)S.nuit.interdictionEntr--;
  if(S.varek.vaincu||S.fin) return;
  // v0.9.5.1 · Le despote exploite le pacte : il fait circuler le faux en vous désignant, puis frappe pendant que la Guilde se déchire.
  { const V=S.varek; if(V.opPacte&&S.jour>=V.opPacte){ V.opPacte=0; S.garnison.relation=Math.max(0,S.garnison.relation-2); S.renom=clamp(S.renom-5,0,100);
      dire("Des copies du rapport de radiation sont clouées aux portes du Gué. On dit qu'elles viennent de vous. Orsan vous fait appeler, glacial.","bad"); if(!destitue()) S.evt.push({t:"fauxCircule"});
      addInfo({id:"vk-faux-circule",sujet:"varek",texte:"Le rapport que Varek vous a remis circule au village, et l'on vous en attribue la diffusion.",source:"Votre observation",vrai:true});
      perso("Varek s'est servi de moi : le rapport circule, et c'est moi qu'on accuse. La Guilde se déchire."); V.opPacteRapt=S.jour+1; }
    if(V.opPacteRapt&&S.jour>=V.opPacteRapt){ V.opPacteRapt=0; V.forceRapt=true; if(peutRapt()){ dire("Pendant que la Guilde se dispute, les hommes de Varek frappent, en plein jour et Orsan présent.","bad"); tentativeRapt(); } V.forceRapt=false; } }
  // Avec un informateur, Varek frappe au premier jour de chaque mission d'Orsan ; sans lui, il tente sa chance.
  if(!K.v02&&orsanAbsent()&&missionIndex()>=0){ const mi=missionIndex(),G=S.garnison;
    if(!G.raptTente[mi]&&(espionActif()?missionJourUn():Math.random()<.3)){ G.raptTente[mi]=true; if(!raptDejoue()) tentativeRapt(); } }
  const V=S.varek;
  if(V.traqueJour&&S.jour>=V.traqueJour&&!V.traqueFait&&S.jour<=JOURS){V.traqueFait=true;if(heroRangS())dire("Les chasseurs de primes ont refusé le contrat : affronter un académicien de rang S serait suicidaire.","good");else S.evt.push({t:"traque"});}
  if(!V.raidFait&&S.jour<=JOURS&&((V.raidJour&&S.jour>=V.raidJour)||S.jour>=24||(espionActif()&&orsanAbsent()&&S.jour>=20))){
    if(peutRaid()){ V.raidFait="en cours"; S.evt.push(S.camp.eloigne?{t:"fumee",j:S.jour}:{t:"raid"}); dire("Les éclaireurs annoncent une offensive contre la Guilde"+(orsanAbsent()?", en pleine absence d'Orsan":"")+".","bad");
      if(espionActif()&&orsanAbsent()) addInfo({id:"pattern2",sujet:"fuite",texte:"L'offensive de Varek tombe pendant une mission d'Orsan. Encore.",source:"Votre observation",vrai:true}); }
    else if(S.jour>=28){ V.raidFait="évité"; dire("Varek renonce à un assaut frontal : la défense du Gué lui coûterait trop cher.","good"); }
  }
  // Varek ne quitte pas la région sans s'être présenté face à la Guilde. Le Gué ne décide que des forces qui l'atteignent.
  if(S.jour>JOURS) S.charge=true;
}
// La blessure se compte en demi-journées : elle recule à chaque moment qui passe.
function avancer(n){ for(let i=0;i<(n||1);i++){ if(S.fin||S.charge) return;
  if(S.blessure>0){ S.blessure--; if(!S.blessure) dire("Votre blessure est refermée.","good"); }
  S.moment++; if(S.moment>1){ S.moment=0; S.jour++; matin(); }
  if(S.moment===1){ const R=raidGuilde(); if(S.jour===R.jour&&!R.fait&&!S.varek.vaincu) raidSansVous(); if(S.orsan2&&S.orsan2.sicaire===S.jour&&!S.orsan2.sicaireFait){ S.orsan2.sicaireFait=true; S.evt.push({t:"sicaire"}); } } } }
function jusquAuMatin(){ const j=S.jour; while(S.jour===j&&!S.fin&&!S.charge) avancer(1); }
function etatDragon(jour,moment){ const D=S.dragon;
  if(D.partiJusqua>=jour) return "parti";
  if(D.mefiance>=3) return "colere";
  const c=["eveille","chasse","eveille","blesse"][(jour-1)%4];
  if(moment===1) return c==="blesse"?"endormi-blesse":"endormi";
  return c; }

function repos(){ S.camp.eloigne=false; let t;
  if(ferme("aubergiste")){ S.pv=Math.max(S.pv,Math.round(pvMax()*.6)); t="L'auberge du Gué tourne sans son patron : un lit froid, pas de repas. Vous ne récupérez qu'à moitié."; }
  else { S.pv=pvMax(); t="Une nuit à l'auberge du Gué. Vos forces sont revenues."; }
  if(S.reco.aubergiste&&S.blessure>0){ S.blessure=Math.max(0,S.blessure-2); t+=" L'aubergiste a laissé une bouillotte et un bouillon : votre blessure se referme plus vite."; }
  dire(t); avancer(1); }
function ilva(){ const r=S.reco.guerisseuse; S.blessure=0; S.pv=r?pvMax():Math.min(pvMax(),S.pv+Math.round(pvMax()*.5)); S.herbes+=r?3:2;
  dire(r?"Hilda ne vous laisse rien payer. Elle vous a vu vous entraîner à l'aube. Soigné entièrement, trois herbes du marais en poche.":"Hilda vous soigne et vous donne deux herbes contre l'eau du marais.","good"); avancer(1); }

function finRival(issue){ const c=S.scene.c,R=S.rival,o=RIVAL[S.origine],ap=[]; S.stats.duels++; let titre,texte,cls,xp=0;

  if(gagne){ xp=10*c.niv; titre="Vous gagnez le duel"; cls="ok"; texte="Vous restez debout, à "+Math.round(r*100)+" % de vos forces."; }
  else { xp=10*c.niv*(c.inflige/c.pvMax)*.5; titre="Vous perdez le duel"; cls="bad"; texte=o.nom+" reste debout, à "+Math.round(r*100)+" % de ses forces. Vous rentrez meurtri."; S.pv=Math.max(1,Math.round(pvMax()*.2)); S.blessure=Math.max(S.blessure,1); }
  const pP=gagne?persev():0, pers=Math.round(xp*pP/100);

function finDragon(issue){ const c=S.scene.c,D=S.dragon,combatEu=c.eveille||c.inflige>0,jour=S.moment===0;

    gains.push("Œil de dragon, porté en pendentif : tout adversaire qui le voit frappe 15 % moins fort."); gains.push(acad()?"Un pacte de non-agression, rien de plus : il respecte votre bravoure, pas votre village ni votre guilde. Il ne se battra pas pour vous.":"Dette du dragon : le jour où vous défierez Varek, il viendra. Sentinelles et pièges balayés, Varek entamé d'un quart."); }
  else if(issue==="repousse"){ fait("repousse"); D.partiJusqua=S.jour+2; if(!S.obj.croc){ S.obj.croc=true; gains.push("Un croc brisé reste dans la cendre : attaque +10."); } renomRoute(35,"toute la vallée l'a vu fuir"); titre="Le dragon s'enfuit"; cls="gold"; texte="Vous le laissez passer. Il arrache le toit de l'antre en s'envolant. Il ne reviendra pas avant deux jours."; }

  else if(issue==="retrait"){ titre="Vous repartez sans bruit"; cls="mid"; texte="Vous quittez l'antre comme vous y êtes entré."; }
  else {
    if(c.humeur==="colere"||c.humeur==="accule"||c.humeur==="about"){ D.pv=Math.max(0,D.pv-c.inflige); finir("mort"); return aller({t:"fin"}); }
    S.stats.defaites++; D.ko++; gainT("tenacite",2); bl=3;
    if(!D.bravoure&&c.inflige>=30&&c.survecus>=3){ D.bravoure=true; S.obj.griffe=true; titre="Reconnu"; cls="mid"; S.pv=Math.round(pvMax()*.15);
      texte="Vous tombez après l'avoir blessé et avoir tenu trois assauts. Il vous observe un moment, puis pousse vers vous, du bout du museau, une griffe tombée de sa patte. Il a vu du courage. Blessure : un jour et demi.";
      gains.push("Griffe de dragon : attaque +8. Un dragon vous l'a donnée."); }
    else if(D.ko===1){ titre="Épargné"; cls="bad"; S.pv=Math.round(pvMax()*.15);
      texte="Il vous retourne du bout d'une griffe, souffle, et vous jette hors de l'antre. Vous ne valez pas l'effort de vous tuer. Blessure : attaque réduite pendant un jour et demi."; }
    else { titre="Laissé pour mort"; cls="bad"; S.pv=Math.round(pvMax()*.1);

  const xc=pct*60*dim, xr=Math.min(c.survecus,5)*(DRAGON.niv-S.niv)*.25*dim;

  const pers=Math.round((xc+xr+xd+xm)*pP/100);
  appris=S.pend.map(k=>FAITS[k][1]).concat(appris); S.pend=[];
  D.pv=Math.max(0,D.pv-c.inflige);
  if(combatEu){ D.rencontres++; S.stats.dragon++; D.calme=0; if(!D.mort&&!D.pacte) D.mefiance=Math.min(3,D.mefiance+1);
    if(!D.mort&&!D.pacte&&c.inflige>=30){ D.agressions++;
      if(D.agressions===2) appris.push("Le dragon tourne désormais au-dessus de Valdren la nuit. Blessez-le encore sans conclure de pacte, et c'est le village qui paiera.");

    if(c.allies.some(a=>a.h)){ S.rival.crete++; appris.push(RIVAL[S.origine].nom+" a tenu face à un dragon. Chaque montée l'aguerrit : il frappera plus fort la prochaine fois."); }
    if(jour&&issue!=="victoire"&&issue!=="repousse"&&issue!=="pacte") renomRoute(6,"des bergers vous ont vu redescendre de la Crête");
    if(D.mefiance>=3&&!D.mort) appris.push("Le dragon vous connaît maintenant. Il est en colère : y retourner avant qu'il se calme, c'est risquer la mort."); }
  const g=gagnerXP(xc+xr+xd+xm+bonus+pers,cap);
  aller({t:"issue",titre,texte,cls,xp:{combat:Math.round(xc+bonus),risque:Math.round(xr),decouverte:xd,maitrise:xm,pers,pPct:pP,g,dim:combatEu?dim:1,pct},appris,gains});
  if(issue==="ko"){ jusquAuMatin(); S.blessure=Math.max(S.blessure,bl); } else avancer(1); }

function batailleFinale(){const c=ennemi("assaut",doctrinal()?"Avant-garde des renégats":"Garde noire de Varek",Math.max(23,varekNiv()-2),"ruse");c.final=true;c.sansFuite=true;c.pv=c.pvMax=Math.round(c.pvMax*1.65*(S.convoi&&S.convoi.defenses?.88:1));c.allies=allies("final").concat(alliésGuilde(true));c.lignes=[["them","La guerre commence au gué : éclaireurs, archers et guerriers renégats ouvrent le passage. Pour atteindre Varek, vous devez tenir la première ligne."]];c.allies.forEach(a=>c.lignes.push(["ally",a.nom+" rejoint la bataille."]));engagerC(c);}
// Une alerte de fumée ne vaut que pour le matin où elle monte. Si du temps a passé, l'attaque a eu lieu sans vous.

// ----- Batailles décisives -----
// L'assaut n'a de sens qu'à l'approche du dénouement : à partir de J-5, Varek n'a plus le temps de se réorganiser.
const J_ASSAUT=JOURS-4;
const nomLieut=()=>doctrinal()?"Capitaine des renégats":"Lieutenant de Varek";
const nomSbires=()=>doctrinal()?"Renégats de la palissade":"Sbires de Varek";
const libJ=k=>{ (S.varek.libJour=S.varek.libJour||{})[k]=S.jour; };
const libre=k=>!!S.varek.capJour[k]&&!pris(k);
// Les jours où la garde du fort se relâche : tirés avec la graine, connus seulement de ceux qui ont vécu en cellule.
function joursFaibles(){ const V=S.varek; if(!V.faibles){ const r=mulberry(hashStr(S.graine+"·fort")), a=J_ASSAUT+Math.floor(r()*5); let b=a; while(b===a) b=J_ASSAUT+Math.floor(r()*5); V.faibles={forgeron:a,guerisseuse:r()<.5?a:b}; } return V.faibles; }
function relache(j=S.jour){ const f=joursFaibles(); return (f.forgeron===j?1:0)+(f.guerisseuse===j?1:0); }
function captivite(){ const V=S.varek; return Object.keys(OTAGES).reduce((n,k)=>n+(V.capJour[k]?(((V.libJour||{})[k])||S.jour)-V.capJour[k]:0),0); }
// Ce à quoi Varek s'attend : votre renom lui annonce que la Guilde ne restera pas passive ; s'il connaît votre visage, il vous guette.
function attenteVarek(){ const V=S.varek; return (S.renom>=SEUILS[1]?1:0)+(S.renom>=SEUILS[2]?1:0)+(V.direct>0||V.repris>0?1:0); }
const phase=(nom,niv,pv,lourd,renfort)=>({nom,niv,pv,lourd:lourd||0,renfort:!!renfort});
function phasesBataille(type,B){ const n=varekNiv(), ph=[]; let a=attenteVarek();
  if(type==="piege") return [phase(nomSbires(),Math.max(16,n-4),1.1),{varek:true}];
  if(type==="commando"){ a-=relache(); if(a>=2) ph.push(phase(nomSbires(),Math.max(16,n-4),1.2)); if(a>=1) ph.push(phase(nomLieut(),n,a>=3?1.4:1.2,2)); ph.push({varek:true,surpris:a<=0}); return ph; }
  if(type==="guilde"){ if(B&&B.renfort) ph.push(phase("Seconde milice, appelée en renfort",Math.max(18,n-2),1.5,0,true)); if(a>=1) ph.push(phase(nomSbires(),Math.max(16,n-4),1.3)); ph.push(phase(nomLieut(),n+1,1.4,2.2)); ph.push({varek:true}); return ph; }
  // Dernier matin : il vient toujours. La défense du Gué décide de ce qui l'atteint ; votre renom, de ce qu'il amène.
  const marge=defenseVillage()-menaceVarek();
  if(marge<0) ph.push(phase(nomSbires(),Math.max(16,n-4),1.4));
  if(marge<5) ph.push(phase(doctrinal()?"Avant-garde des renégats":"Garde noire de Varek",Math.max(23,n-2),marge>=2?1.15:1.65));
  if(a>=1) ph.push(phase(nomLieut(),n+1,1.3,2.2));
  ph.push({varek:true}); return ph; }
function chargeExplication(){ const m=defenseVillage()-menaceVarek();
  return (m>=5?"Le Gué tient : son avant-garde s'est brisée sur les défenses avant d'arriver jusqu'à vous.":m>=2?"Le Gué résiste : son avant-garde arrive affaiblie.":m>=0?"Le Gué tient de justesse.":"Le Gué cède : ses sbires passent avant même son avant-garde.")+(attenteVarek()>=1?" Votre renom l'a prévenu : il amène son lieutenant.":""); }
function alliesBataille(type){ if(type==="commando"||type==="piege") return allies(true);

  return allies("final").concat(alliésGuilde(true)); }
function offAssautGuilde(){ const G=S.garnison;

function introBataille(B){ return {commando:B.phases[0].varek?"Il ne vous attendait pas : vous franchissez la palissade sans une alerte.":"Une cloche sonne dans le fort : il vous attendait.",

function lancerPhase(){ const B=S.bataille; if(!B) return aller({t:"carte"});

// Azharel ne combat pas : son ombre suffit. Les 25 % représentent la frayeur de voir un dragon au-dessus du champ de bataille.

function varekDecisif(ph){ const B=S.bataille, st=S.varek.stage, c=ennemi("varek",doctrinal()?"Varek, chef des renégats":"Varek, seigneur-brigand",varekNiv(),"codifie");

  if(c.connu) c.lignes.push(["tell","Il vous a déjà vu combattre. Il a préparé une réponse à votre façon de "+({def:"vous couvrir",att:"attaquer",esq:"esquiver"}[c.connu])+"."]);

// Varek ne fuit qu'au cœur de l'affrontement, une seule fois, quand il sent le combat perdu. Ce qui l'entoure peut lui couper la route.
function tenteFuiteVarek(c){ if(c.kind!=="varek"||!c.decisif||c.fuiteTentee||c.pv<=0||c.pv>=c.pvMax*.3) return false; c.fuiteTentee=true;

function evasionVarek(){ const B=S.bataille||{type:"final"}; S.bataille=null; return commencerEpilogue(B.type==="piege"?"orsanSauve":"fuite"); }

function echecBataille(c,issue){ const B=S.bataille||{type:"final"}, xp=Math.round(11*c.niv*(c.inflige/c.pvMax)*.5), g=gagnerXP(xp), X={combat:xp,risque:0,decouverte:0,maitrise:0,g}; S.bataille=null;

// ===== v0.8.7.3 · La convocation d'Orsan : premiers pas de la communication =====
// Déclenchée par les rumeurs sur les sorties nocturnes. Deux temps : Orsan, puis ses adjoints.

function convocMatin(){ if(!acad()||destitue()||S.convoc||(S.nuit.soupcon||0)<2||orsanAbsent()||S.varek.vaincu) return;

const CV_REP={

function tic(){ return pick(["se raidit et regarde la porte.","change aussitôt de sujet : « Et les rondes du Gué, on en parle ? »","marque un silence. Un silence trop long."]); }
function convocChoix(k){ const C=S.convoc, G=S.garnison, E=S.espion, ap=[];
  if(C.etape===1){ const R=CV_REP[k]; C.r1=k; let t;
    if(k==="azharel"){ if(R.vrai()){ G.relation++; C.dragonDit=true; t="Orsan se tait longtemps. « Un dragon. Et tu en reviens vivant. » Il ne sanctionne pas un rang S, mais il sait, désormais. Et ses adjoints aussi."; ap.push("Orsan apprécie votre franchise : confiance +1.","Ceux qui étaient dans la pièce connaissent maintenant l'existence du dragon.");
        if(E.actif&&ADJ.includes(E.qui)) addInfo({id:"cv-dragon",sujet:"fuite",texte:"Vous avez parlé du dragon devant Maëlys et Darian. Si l'un d'eux renseigne Varek, il le saura bientôt.",source:"Votre réflexion",vrai:true}); }
      else { C.mensonges=(C.mensonges||0)+1; t="« Un dragon ? » Darian éclate de rire. Personne ne vous croit, ce qui vous arrange peut-être."; } }
    else if(k==="silence"){ G.relation=Math.max(0,G.relation-1); t="Vous ne dites rien. Orsan hoche la tête lentement. « Comme tu voudras. » La confiance se refroidit."; ap.push("Confiance d'Orsan −1."); }
    else if(k==="defensive"){ G.relation=Math.max(0,G.relation-1); C.braque=true; t="« De quel droit me fait-on suivre ? » Le ton monte. Orsan lève la main : « Personne ne te fait suivre. On parle, c'est tout. »"; ap.push("Confiance d'Orsan −1. Mais vous avez repris la main : les adjoints seront plus prudents."); }
    else { const vrai=R.vrai(), doute=!vrai&&Math.random()<(k==="balade"?.6:.4);
      if(!vrai){ C.mensonges=(C.mensonges||0)+1; if(!doute&&(k==="herbes"||k==="entrainement")) C.verif={k,jour:S.jour+2+Math.floor(Math.random()*2)}; }
      if(doute){ G.relation=Math.max(0,G.relation-1); t="Maëlys fronce les sourcils. « Curieux. On ne vous a jamais vu revenir avec rien de tel. » Votre version sonne creux."; ap.push("Mensonge éventé : confiance d'Orsan −1."); }

      addInfo({id:"cv-tic",sujet:"fuite",texte:"Pendant la convocation, quand vous avez parlé de l'informateur, "+(react?n+" "+react:"aucun adjoint n'a réagi."),source:"Votre observation, à la convocation",vrai:true,ev:react?{src:"convoc",set:[espAdj]}:null}); }

    if(bluff&&!preuve){ C.mensonges=(C.mensonges||0)+1; E.alerte=E.actif?true:E.alerte; ap.push("C'était du bluff. S'il y a un informateur, il sait maintenant qu'on le cherche."); }
    else { G.relation++; ap.push("Orsan : « Tiens-moi au courant, et à moi seul. » Confiance +1."); } }
  else if(k==="nier"){ t="« Je n'ai rien à ajouter. » Darian insiste, Maëlys aussi. Vous tenez bon."+(C.braque?" Après votre éclat, ils n'osent pas pousser plus loin.":""); if(!C.braque){ G.relation=Math.max(0,G.relation-1); ap.push("Confiance d'Orsan −1."); } }

      <p class="small muted" style="margin-top:4px">${acad()?"De jour, l'académie encadre vos gestes : vos traits n'y grandissent qu'à moitié. La nuit, ils grandissent pleinement.":"Vos traits grandissent avec ce que vous vivez."}</p></div>
    ${al.length?`<p class="small">Alliés : <b>${al.join(", ")}</b></p>`:""}
    <div><div class="eyebrow" style="margin-bottom:6px">Ce que vous avez acquis</div>
      ${ac?`<ul class="plain">${ac}</ul>`:`<p class="small muted">Rien encore.</p>`}</div>`; }

function rMonde(){ const D=S.dragon,V=S.varek,R=S.rival,F=S.foret; let prev="";
  if(D.mort) prev="Mort.";
  else if(D.pacte) prev="Il ne vous combattra plus.";
  else if(D.rythme) prev=`Aujourd'hui : ${ETATS[etatDragon(S.jour,0)].toLowerCase()} le jour, ${ETATS[etatDragon(S.jour,1)].toLowerCase()} la nuit.<br>Demain : ${ETATS[etatDragon(S.jour+1,0)].toLowerCase()} le jour.`;
  else prev="Vous ne connaissez pas encore son rythme. Il faut l'avoir vu dans trois états différents.";
  const vk=V.vu<0?`<dd>Vous ne l'avez jamais vu. Les rumeurs vous diront s'il se prépare.</dd>`:
    `<dd>Niveau ${V.vuNiv} lors de votre dernière visite. ${VAREK[V.vu].prep}${V.vu<V.stage?" <span class='pill mid'>il a changé depuis</span>":""}${V.connu?`<br><span class="small">Il vous a vu combattre : il prépare une réponse à votre façon de ${({def:"vous couvrir",att:"attaquer",esq:"esquiver"}[V.connu])}.</span>`:""}</dd>`;
  const rv=R.vu?`<dt>${RIVAL[S.origine].nom}</dt><dd>${RIVAL[S.origine].qui}${acad()?(R.allie?(S.feuVert?", autorisé par Orsan":", non reconnu par la guilde"):""):", rang "+["B","A","S"][selenaRang()]+(selenaRang()?" (la guilde la croit B)":"")} · <b>${opNom(R.op)}</b>${R.allie?' <span class="pill ok">allié</span>':""}${R.mepris?'<br><span class="small">Il vous méprise : sa garde sera basse.</span>':""}${R.jmepris?'<br><span class="small">Vous le sous-estimez : votre garde sera basse.</span>':""}</dd>`:"";
  const reco=Object.keys(S.reco).filter(k=>S.reco[k]);
  const fo=F.crainte>0||F.merci>0||F.meute||F.adoube?`<dt>Forêt</dt><dd class="small">${foretTexte()}</dd>`:"";
   const G=S.garnison, estime=defenseVillage()>=menaceSelonOrsan();
   const defense=`<dt>Guilde</dt><dd>${destitue()?"Commandant Morvan · rang A ("+(orsanAbsent()?"en mission":"présent")+"). Orsan · rang S, démis, toujours à Valdren.":"Orsan · rang S ("+(suspendu()?"suspendu":orsanAbsent()?"en mission":"présent")+")."} ${ADJ.map(k=>SUSPECTS[k].Nom+" : "+(G[k]==="parti"?"démis":"rang "+G[k])).join(" ; ")}.<br>Défense du Gué : ${defenseVillage()} · fortifications ${G.fortif}/3.<br><span class="small muted">${destitue()?"Morvan juge la défense selon le règlement. Orsan, lui, la juge "+(estime?"tenable":"trop mince")+", et le dit.":G.conseil?"Orsan juge la défense "+(estime?"suffisante":"insuffisante")+" face à ce qu'il sait de Varek.":"Rencontrez Orsan pour connaître son estimation."}</span></dd>${V.milice?`<dt>Milice</dt><dd class="small">Renforcée de +${V.milice}/6 par la forge d'Ivan.</dd>`:""}`;
   $("#monde").innerHTML=`
    <div><div class="eyebrow">Ce que le monde sait de vous</div>
      <div class="gauge" style="margin-top:6px"><div class="lab"><span><b>${renomNom(S.renom)}</b></span><span class="mono">${S.renom} / 100</span></div>
      <div class="bar renom"><i style="width:${S.renom}%"></i>${SEUILS.map(s=>`<span class="tick" style="left:${s}%"></span>`).join("")}</div></div>
      <p class="small" style="margin-top:6px">${palierTexte()}</p>
      <p class="small muted" style="margin-top:4px">${S.route?`Rumeurs en route : ${S.route>0?"+":""}${S.route} demain matin. `:""}Varek réagit à ce qu'il sait : votre renom, ce qu'il a vu de ses yeux, les otages qu'on lui reprend. Au dernier matin, il se présentera devant la Guilde, quoi qu'il arrive : la défense du Gué décide des forces qui l'atteignent, votre renom de ce à quoi il s'attend. À partir du jour ${J_ASSAUT}, vous pouvez aussi porter la guerre à son fort.</p></div>
    <dl class="kv">${defense}<dt>Varek</dt>${vk}
      <dt>Dragon</dt><dd>${D.mort?"Mort.":D.pacte?(D.partenaire?"Votre partenaire.":"Lié à vous par un pacte."+(acad()?" Non-agression seulement.":" Lien : "+D.lien+".")):`Niveau 150 · ${pc(D.pv,DRAGON.pvMax)} % de ses forces<br><span class="pill wrap ${D.mefiance>=3?"bad":D.mefiance?"mid":"ok"}">${mefNom[D.mefiance]}</span>${D.agressions?`<br><span class="small" style="color:var(--bad)">Blessé ${D.agressions} fois sans pacte. À 3, il descend sur Valdren.</span>`:""}${D.soins?`<br><span class="small">Soigné ${D.soins} fois.${D.confiance?" Il vous attend.":""}</span>`:""}`}</dd>
      <dt>Rythme</dt><dd class="small">${prev}</dd>${fo}${rv}
      ${V.captifs.length?`<dt>Otages</dt><dd class="small" style="color:var(--bad)">Au fort : ${V.captifs.map(k=>OTAGES[k]).join(", ")}.</dd>`:V.repris?`<dt>Otages</dt><dd class="small">${V.repris} repris à Varek.</dd>`:""}
      ${reco.length?`<dt>Ont vu vos efforts</dt><dd class="small">${reco.map(k=>({forgeron:"le forgeron",guerisseuse:"Hilda",aubergiste:"l'aubergiste"}[k])).join(", ")}</dd>`:""}</dl>
    <div class="journal"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="eyebrow">Rumeurs et journal</span>${S.origine&&!S.fin?`<button class="lnk" data-a="archives">Archives · ${S.infos.length}</button>`:""}</div>
      <ul class="plain scroll">${S.log.map(l=>`<li class="${l.c}"><small>J${l.j}</small>${esc(l.t)}</li>`).join("")}</ul></div>`; }

function rOrigine(){ return `<div class="card gold"><h2>Trente-cinq jours avant l’offensive</h2>
  <p>Vous êtes niveau 10. Varek, ancien académicien, commence niveau 22. Sa milice, ses rencontres et son expérience peuvent le conduire jusqu'au niveau 45. Pourquoi il a rompu avec l'Académie, et ce qu'il est vraiment, personne ne vous le dira d'emblée.</p>
  <p>Varek combat l’Académie et ses Guildes. Ivan ou Hilda risquent d’être interceptés hors des murs lorsque la garnison est dégarnie. Orsan, chef de Guilde de rang S, et ses adjoints de rang A sont de véritables protecteurs. Ils progresseront au fil des jours.</p>
  <p>Au jour 36, la force de Varek, votre réputation et la défense du village décideront de son prochain mouvement. Une bataille finale se déroule en plusieurs phases, pas en duel isolé.</p>
  <p>Chaque journée compte deux moments, le jour et la nuit. Ce que vous faites en public voyage par la rumeur, et Varek écoute. La nuit, on peut sortir de son rôle, mais quelqu'un voit toujours, ou presque.</p>
  <p>Ce que vous apprenez s'archive : rumeurs, proclamations, confidences. Toutes ne sont pas vraies. Vous pouvez ne jamais ouvrir vos archives et finir l'aventure, ou vous en servir pour la comprendre.</p>
  <p class="small muted">Gagner à bout de forces rapporte plus d'expérience (jusqu'à +25 % sous 35 % de PV). Tomber coûte une blessure : une demi-journée face à un loup ou en contrat de rang C, une journée face à un ours ou un brigand, une journée et demie face au dragon.</p>
  <p><b>D'où venez-vous ?</b></p>
  <div class="origines">
    <button class="origine" data-a="orig-acad"><b>Académicien</b><span>Sorti de l'académie, inscrit à la guilde. Des contrats de rang C à S, une Garde ferme au 4ᵉ contrat, les leçons du capitaine Orsan dès le rang B. Mais vos gestes sont codifiés, donc lisibles. Les bois et la Crête vous sont interdits : vous n'y irez que la nuit. Au village, un seul animal toléré : un loup. Et Varek est une mission de rang S, qu'on ne confie pas à qui vient seul.</span></button>
    <button class="origine" data-a="orig-aven"><b>Aventurier</b><span>Personne ne vous a appris. Les bois et la Crête sont à vous, de jour comme de nuit. Vos traits grandissent avec chaque blessure et chaque réussite. Loups, ours et meute vous suivent partout. La guilde ne vous confie que les rangs C et B, sauf si un haut gradé se porte garant de vous. Rien ne vous interdit de monter au fort.</span></button>
  </div>${rBanc()}</div>`; }
function rBanc(){ if(!BANC.ouvert) return `<button class="lnk" data-a="banc">Mode banc d'essai (pour les testeurs)</button>`;
  const opt=(k,v,l)=>`<button class="pill ${BANC[k]===v?"ok":""}" data-a="banc-${k}-${v}">${l}</button>`;
  return `<div class="card"><div class="eyebrow">Mode banc d'essai</div>
  <p class="small muted">Pour vérifier chaque scénario. En partie normale, laissez tout « au hasard » : le joueur ne connaît ni le profil de Varek ni l'informateur.</p>
  <div class="row small"><b>Profil de Varek</b>${opt("doctrine","aleatoire","au hasard")}${opt("doctrine","injustice","l'ancien révolté")}${opt("doctrine","domination","le despote")}</div>
  <div class="row small"><b>Informateur</b>${opt("espion","aleatoire","au hasard")}${Object.keys(SUSPECTS).map(k=>opt("espion",k,SUSPECTS[k].nom)).join("")}</div>
  <div class="row small"><b>Profil pur (test)</b>${opt("profil","aucun","aucun")}${opt("profil","force","Force")}${opt("profil","ruse","Ruse")}${opt("profil","alliance","Alliance")}<span class="muted">Réservé au banc : limite les méthodes à celles du profil, sans figer de classe.</span></div>
  <div class="row small"><b>Graine</b><input class="champ" style="max-width:150px" data-banc="graine" value="${escA(BANC.graine)}" placeholder="vide = nouvelle" maxlength="12"><span class="muted">Même graine, même configuration : profil, informateur, missions d'Orsan.</span></div>
  <button class="lnk" data-a="banc">Refermer</button></div>`; }

function rCarte(){ if(!S.origine) return rOrigine();
  const D=S.dragon,nuit=S.moment===1,bas=S.pv<pvMax()*.45; let h="";
  if(D.mefiance>=3&&!D.mort) h+=`<div class="warn"><b>Le dragon est en colère.</b> Il vous attend. Si vous tombez dans l'antre maintenant, la partie s'arrête. Il se calme après trois jours sans vous voir.</div>`;
  h+=bandeauxArc(); h+=carteBram(); h+=carteYsolde(); h+=carteEnquete(); h+=carteAgent(); h+=carteVarekNuit();
  if(S.varek.captifs.length) h+=`<div class="warn"><b>Varek tient ${S.varek.captifs.map(k=>OTAGES[k]).join(" et ")}.</b> ${pris("forgeron")?"La forge est froide. ":""}${pris("guerisseuse")?"Personne ne soigne plus. ":""}${pris("aubergiste")?"L'auberge ne repose qu'à moitié. ":""}Montez au fort pour les reprendre.</div>`;
  { const bl=Object.keys(OTAGES).filter(k=>!pris(k)&&S.village[k]>=S.jour&&!S.menace[k]);
    if(bl.length) h+=`<div class="warn"><b>Le dragon est descendu sur le village.</b> ${bl.map(k=>OTAGES[k]+" est alité jusqu'au jour "+S.village[k]).join(", ")}. Conséquence de vos blessures répétées, sans pacte.</div>`; }
  if(bas) h+=`<div class="warn" style="border-color:var(--mid);background:#2a2410">Vous êtes mal en point (${S.pv} PV). Un combat gagné dans cet état rapporte ${persev()?"+"+persev()+" % d'expérience":"un peu plus d'expérience sous 35 % de PV"}, mais une chute coûte une blessure.</div>`;
  const ec=S.obj.ecailles>0&&S.obj.cuirasse<2, ecOff=ferme("forgeron")?"Ivan est "+fermeTxt("forgeron")+".":ec?false:(S.obj.cuirasse>=2?"Votre cuirasse ne peut plus être renforcée.":"Il vous faut une écaille de dragon.");
  let contrats="";
  if(!nuit) RANGS.forEach((R,r)=>{ const niv=Math.max(6,S.niv+R.d); let off=false;
    if(r>rangMax()) off=acad()?false:"Réservé aux diplômés. Seul un haut gradé pourrait se porter garant de vous.";
    if(!off&&r>S.rang) off=`Pas encore : deux contrats de rang ${RANGS[S.rang].k} réussis vous feront promouvoir (${S.parRang[S.rang]} / 2).`;
    if(!off&&r===3&&!soutien()) off="Plafond de verre : la guilde ne confie pas le rang S à qui vient seul. Il vous faut un allié, ou 40 de renom pour qu'on vous donne une escouade.";
    if(r>S.rang+1) return;
    contrats+=actBtn("mission-"+r,`Contrat de rang ${R.k}`,`Un adversaire de niveau ${niv}${r===3?", plus robuste que tout ce que la guilde propose":""}. ${R.style==="brut"?"Une bête : brutale, prévisible.":R.style==="codifie"?"Un combattant formé : des gestes codifiés, une vraie garde.":"Un adversaire rusé : feintes et brise-garde."}${acad()&&r===S.rang&&S.stats.guilde<4?" Garde ferme au 4ᵉ contrat ("+S.stats.guilde+" / 4).":""}${S.nuit.bateau?" Prochaine mission : bateau, moitié de l'expérience.":""}`,coutRenom(R.renom+Math.floor(Math.max(0,S.niv-18)/2)),off); });
  const entrOff=acad()&&S.nuit.interdictionEntr>0?"Sanction : entraînement interdit encore "+S.nuit.interdictionEntr+" jour(s).":false;
  h+=`<div class="lieu village"><div><div class="eyebrow">${nuit?"La nuit · peu de témoins":"Sûr · public"}</div><h3>Village de Valdren</h3></div><div class="acts">
    ${actBtn("archives","Consulter vos archives",S.infos.length+" information"+(S.infos.length>1?"s":"")+" recueillie"+(S.infos.length>1?"s":"")+". Retenir, annoter, confier à quelqu'un.","sans temps")}
    ${nuit?"":contrats||""}
    ${destitue()?actBtn("orsan-visite","Passer à la Guilde","Le commandant Morvan y commande désormais. Orsan, démis, s'y montre encore.",""):actBtn("orsan-visite","Rencontrer Orsan et ses adjoints","Le chef de Guilde est un rang S, mais il n’est pas le plus haut gradé de l’Académie. Comprendre les défenses et l’histoire de Varek.","",orsanAbsent()?(suspendu()?"Orsan est suspendu le temps de l'enquête. Un inspecteur tient la Guilde.":"Orsan est en mission. Ses adjoints assurent la garde."):false)}
     ${actBtn("boutique","Entrer chez Odile","La boutique : armes, flèches, et ce qu'on y raconte. Vous avez "+(S.or||0)+" or.","sans temps")}${btnEcouter("aubergiste")}${actBtn("repos","Dormir à l'auberge du Gué",ferme("aubergiste")?"Sans l'aubergiste, vous ne remontez qu'à 60 % de vos points de vie.":"Tous vos points de vie reviennent.","sans témoin")}
    ${nuit?actBtn("entrainer","S'entraîner en cachette",acad()?"Seul, sans dormir : volonté et ténacité grandissent, un peu d'expérience. Les artisans de l'aube voient parfois vos efforts.":"Dans la cour d'armes réservée aux diplômés. Volonté, et la Garde apprise à la 2ᵉ nuit. Un haut gradé peut vous surprendre : cellule, ou mentor.","fatigue −10 % PV",entrOff):""}
    ${nuit?"":actBtn("ilva","Voir Hilda la guérisseuse","Soigne la blessure, rend la moitié des PV, et deux herbes contre l'eau du marais.","sans témoin",ferme("guerisseuse")?"Hilda est "+(pris("guerisseuse")?"prisonnière au fort":"blessée par le dragon, alitée jusqu'au jour "+S.village.guerisseuse)+".":false)}
    ${!nuit&&S.mentor&&S.orsan<2?actBtn("lecon","Leçon du capitaine Orsan",S.orsan===0?"Lecture d'école : lire d'emblée la garde de tout combattant formé, Varek compris.":"Contre-feinte : votre couverture ne sera plus trompée par les feintes.","une matinée",orsanAbsent()?"Orsan est absent, en mission de l’Académie.":S.leconJour===S.jour?"Une leçon par jour.":false):""}
    ${nuit?"":actBtn("atelier","Atelier du forgeron : les armes","Faire forger une dague ou un arc, ou améliorer une arme. "+(acad()?"Payé en bons de forge de la guilde, jusqu'à votre rang.":"Payé en matériaux de la forêt, jusqu'au rang B sans garant."),"",ferme("forgeron")?"Ivan est "+fermeTxt("forgeron")+".":false)}
    ${nuit?"":actBtn("herbo","Herboristerie d'Hilda : les remèdes","Elle prépare ce que vous lui apportez : plantes des bois, simples ramassés en mission, fleurs de cendre.","",ferme("guerisseuse")?"Hilda n'est pas là.":false)}
    ${nuit?"":["forgeron","guerisseuse"].filter(k=>libre(k)&&!(S.varek.interroge||{})[k]&&!ferme(k)).map(k=>actBtn("interroger-"+k,"Interroger "+(k==="forgeron"?"Ivan":"Hilda")+" sur le fort","Ce qu'on voit d'une cellule : les relèves, les absences, les jours où la garde se relâche.","sans temps")).join("")}
    ${nuit?"":actBtn("forge-pub","Faire forger une écaille au marché","Cuirasse d'écaille en un seul moment. Tout le marché regarde.",coutRenom(25),ecOff)}
    ${actBtn("forge-sec","Faire forger une écaille en secret",`Même cuirasse, volets clos. ${S.reco.forgeron?"Le forgeron vous ouvre avant l'aube : un seul moment.":"Prend deux moments."}`,"sans témoin",ecOff)}
  </div></div>`;
  if(acad()){
    h+=`<div class="lieu ${nuit?"nuitl":"bois"}"><div><div class="eyebrow">${nuit?"Interdit · de nuit":"Interdit par l'académie"}</div><h3>Hors les murs</h3></div>
      <p class="small muted">${nuit?`Bois profond${S.nuit.sorties>=2&&!S.nuit.interdit?" et Crête de cendre":""}. Les gardes font des rondes : risque d'être surpris ${Math.round(chanceSurpris(false)*100)} %.${S.renom>=40?" Votre renom vous vaudrait un passe-droit.":""}`:"De jour, votre place est au comptoir de la guilde. La nuit, personne ne vous regarde… presque."}</p>
      <div class="acts">${actBtn("sortir","Sortir hors les murs","Vous choisirez où aller une fois dehors.","sanction si surpris",nuit?false:"Seulement la nuit.")}</div></div>`;
    if(S.nuit.interdit) h+=`<div class="lieu dragon"><div><div class="eyebrow">Interdit</div><h3>Crête de cendre</h3></div><p class="small muted">L'académie vous a surpris sur le sentier. La Crête vous est fermée. Il ne vous reste que l'envie d'être digne de ce qui vit là-haut.</p></div>`;
  } else {
    const ss=Object.keys(SECTEURS).map(k=>{ const Z=SECTEURS[k],z=S.secteurs[k];
      return actBtn("sect-"+k,Z.nom,`Un adversaire de niveau ${S.niv+Z.d}. ${Z.risque}${z.v?" Maîtrise des lieux : "+z.m+" / 3.":""}${k==="lisiere"?" Loups et ours peuvent être dominés d'un seul grand coup.":""}${k==="lisiere"&&S.stats.chasse<3?" Instinct du chasseur à la 3ᵉ chasse réussie ("+S.stats.chasse+" / 3).":""}`,coutRenom(1)); }).join("");
    h+=`<div class="lieu bois"><div><div class="eyebrow">Risqué · discret</div><h3>Bois profond</h3></div><p class="small muted">${foretTexte()}</p><div class="acts">${ss}${autoriseCamp()?actBtn("camper","Dormir à la belle étoile","La forêt vous reconnaît. Les animaux veillent ; vous récupérez vos PV, mais perdez le fil des nouvelles de Valdren. Une présence nocturne rôde.","une nuit"):""}</div></div>
    <div class="lieu dragon"><div><div class="eyebrow">Démesuré · rien ne vous l'interdit</div><h3>Crête de cendre</h3></div>
      <p class="small muted">${D.mort?"L'antre est vide pour toujours.":D.pacte?"Le dragon vous y attend : tribut tous les trois jours, mets à lui porter, entraînement.":"Un dragon de niveau 150. Vous verrez son état en arrivant et pourrez encore rebrousser chemin. "+(nuit?"De nuit, personne ne vous verra monter.":"De jour, les bergers vous verront redescendre si vous combattez (renom +6).")}</p>
      <div class="acts">${actBtn("antre","Monter à l'antre du dragon",D.mefiance>=3?"Il est en colère et vous attend.":(D.rythme?"En ce moment : "+ETATS[etatDragon(S.jour,S.moment)].toLowerCase()+".":"Vous ne savez pas dans quel état vous le trouverez."),nuit?"sans témoin":coutRenom(6)+" si combat",D.mort?"Le dragon est mort.":false)}</div></div>`; }
  { const rk=Object.keys(REMEDES).filter(k=>S.remedes[k]>0);
    if(rk.length) h=h+`<div class="lieu"><div><div class="eyebrow">Votre sac</div><h3>Remèdes</h3></div><div class="acts">${rk.map(k=>actBtn("boire-"+k,(k==="onguent"?"Passer sur la lame : ":k==="infusion"?"Boire avant le combat : ":"Prendre : ")+REMEDES[k].nom,REMEDES[k].desc,"×"+S.remedes[k],(k==="onguent"||k==="infusion")&&S.prep[k]?"Déjà prêt pour le prochain combat.":(k==="baume"||k==="tisane")&&S.pv>=pvMax()?"Vous êtes en pleine forme.":false)).join("")}</div></div>`; }
  h+=`<div class="lieu fort"><div><div class="eyebrow">L'objectif</div><h3>Fort de Varek</h3></div>
    <div class="acts">${S.varek.vaincu?`<p class="small muted">Le fort est tombé. Ses palissades ne gardent plus personne.</p>`:raidAujourdhui()?actBtn("raid-participer","Participer au raid de la Guilde","La colonne de Maëlys et Darian part à l'aube. Orsan reste tenir la Guilde.","bataille"):actBtn("fort","Monter au fort","Vous verrez sa préparation avant de décider. Si vous perdez, il vous capture. S'il vous voit, il se souviendra.","")}</div></div>${carteArc()}`;
  return h; }

function rDehors(){ const D=S.dragon; let b=Object.keys(SECTEURS).map(k=>{ const Z=SECTEURS[k],z=S.secteurs[k];
    return actBtn("sect-"+k,Z.nom,`Un adversaire de niveau ${S.niv+Z.d}. ${Z.risque}${z.v?" Maîtrise : "+z.m+" / 3.":""}`,""); }).join("");
  if(S.nuit.sorties>=2&&(!S.nuit.interdit||(acad()&&S.rang>=3))&&!D.mort) b+=actBtn("crete","Prendre le sentier de la Crête",`La nuit, le dragon dort. Une patrouille de l'académie surveille le sentier : risque ${Math.round(chanceSurpris(true)*100)} %. ${acad()&&S.rang>=3?"Rang S : on ne vous arrêtera pas, mais on parlera.":acad()&&S.rang===2?"Rang A : les gardes ferment les yeux deux fois ("+(S.nuit.prisA||0)+" / 3).":"Surpris, la Crête vous sera interdite pour toujours."}`,"interdit");
   if(autoriseCamp())b+=actBtn("camper","Camper sous les arbres","Les loups et les ours veilleront. "+(S.camp.morghalVu?"Mais "+creatureCourt()+" peut surgir.":"Mais quelque chose rôde dans les bois profonds.")+" Une nuit loin du village.","une nuit");
  b+=actBtn("rentrer","Rentrer sans bruit","La nuit passe.","");
  return `<div class="card night"><div class="eyebrow">Hors les murs · nuit</div><h2>Vous êtes sorti sans être vu</h2>
    <p>Les bois sont noirs. Personne ne vous a appris ce qui vit ici.</p><p class="small muted">${foretTexte()}</p><div class="acts">${b}</div></div>`; }

function rLoup(){ return `<div class="card night"><div class="eyebrow">Lisière des ronces</div><h2>Un loup cendré, pris au piège</h2>
  <p>La patte serrée dans les mâchoires d'un piège de braconnier. Il montre les dents, mais il n'a plus la force de mordre bien fort.${S.loup.soin?" Il vous reconnaît.":""}</p>
  <div class="acts">${actBtn("loup-soin","Le soigner et le nourrir",S.herbes?"Une herbe d'Hilda suffira.":"Sans herbe d'Hilda, il risque de vous mordre.","")}${actBtn("loup-tuer","L'achever","Un peu d'expérience, et c'est fini. La forêt s'en souviendra.","")}${actBtn("loup-laisser","Passer votre chemin","La nuit, ou la journée, passe.","")}</div></div>`; }

function rSoumis(){ const c=S.scene.c;
  return `<div class="card gold"><div class="eyebrow">${c.kind==="guilde"?"Contrat de rang "+RANGS[c.rang].k:SECTEURS[c.secteur].nom} · bête dominée</div><h2>${c.nom} plie devant vous</h2>
  <p>Un seul coup lui a ôté plus de ${Math.round(DOMINE*100)} % de ses forces. Elle se couche, la gorge offerte. Elle ne se battra plus. Ce que vous faites maintenant, la forêt le saura.</p>
  <div class="acts">
    ${actBtn("soumis-lier","L'apprivoiser",`${c.bete==="Loup"?"Un loup":"Un ours"} à vos côtés dans les combats (deux bêtes au plus). Expérience à 80 %.`,"crainte +1 · merci")}
    ${actBtn("soumis-fuir","La laisser partir","Elle portera la nouvelle : un humain l'a tenue à sa merci et l'a laissée vivre. Expérience à 80 %.","crainte +3 · merci")}
    ${actBtn("soumis-tuer","L'achever","Toute l'expérience. Les bêtes ne retiendront que le sang.","crainte +2")}
  </div></div>`; }

function rForet(){ const ami=foretAmie();
  return ami?`<div class="card gold"><div class="eyebrow">Bois profond · la forêt a parlé de vous</div><h2>La meute vient à vous</h2>
    <p>Ils sortent des ronces sans un bruit, une douzaine, et s'arrêtent à dix pas. Au milieu, un loup gris haut comme un poulain. Il ne montre pas les dents. Les bêtes que vous avez épargnées ont parlé pour vous.</p>
    <div class="acts">${actBtn("foret-ok","Accepter leur protection","La meute combattra à vos côtés dans les bois, en contrat et au fort.","")}${actBtn("foret-non","Refuser et passer","Vous ne devez rien à personne. Rien ne change.","")}</div></div>`
  :`<div class="card bad"><div class="eyebrow">Bois profond · la forêt a parlé de vous</div><h2>Le chef de meute vous traque</h2>
    <p>Trop de sang, et personne pour dire que vous savez épargner. Le Vieux Gris est venu régler la question lui-même. Il est plus fort que tout ce que vous avez croisé ici, et il ne se laissera pas dominer d'un coup.</p>
    <p class="small muted">Vaincu, vous finirez sur une civière, pas dans une tombe. Vainqueur, la forêt vous adoubera.</p>
    <div class="acts">${actBtn("foret-face","Lui faire face","Niveau "+(S.niv+5)+", rusé, robuste. Votre meilleure garde lue sera nécessaire.","")}${actBtn("foret-fuir","Rebrousser chemin","Il vous laisse sortir des bois. Il reviendra.","")}</div></div>`; }

function rVeille(){ return `<div class="card night"><div class="eyebrow">Crête de cendre · second soin</div><h2>Il vous laisse panser la plaie</h2>
  <p>Cette fois il ne gronde pas. Il pose la tête sur ses pattes et ferme à demi les yeux. Il est à votre merci, et il le sait. Ce que vous faites maintenant, il s'en souviendra.</p>
  <div class="acts">${actBtn("veille-obs","Rester et l'observer","Vous veillez près de lui. Vous en apprendrez un peu sur sa façon de bouger.","")}${actBtn("veille-partir","Partir sans bruit","Vous le laissez à son repos.","")}${actBtn("veille-att","L'attaquer maintenant","Une trahison. Il entrera en colère : s'il vous abat, la partie s'arrête.","danger de mort")}</div></div>`; }
function rAmi(){ const D=S.dragon,sc=S.scene; let b="";
  Object.keys(METS).forEach(k=>{ if(S.gibier[k]>0) b+=actBtn("offrir-"+k,"Lui porter un "+METS[k].nom,D.vus[k]?(METS[k].eff>0?"Il l'a apprécié la dernière fois.":"Il l'a refusé la dernière fois."):"Vous ne savez pas s'il l'appréciera.","×"+S.gibier[k]); });
  const exoOff=D.lien<=-2?"Il vous tourne le dos.":!D.partenaire&&S.jour<D.indiff?"Il ne vous regarde plus. Revenez à partir du jour "+D.indiff+".":D.exoJour===S.jour?"Une séance par jour.":false;
  b+=actBtn("exo","S'entraîner avec lui",D.partenaire?"Il retient ses flammes. De l'expérience, sans danger de mort.":"Tenez quatre assauts et placez "+4*attJ()+" dégâts en six tours (quatre coups francs : il faut des ripostes, et connaître sa faille) : il vous reconnaîtra Brave et deviendra votre partenaire. Sinon il se désintéressera de vous pendant trois jours.","",exoOff);
  if(!D.parole&&(D.lien>=2||D.soins>=2||D.partenaire))b+=actBtn("ecoute-dragon","Écouter ce que dit le dragon","Une capacité rare : comprendre ses pensées et découvrir son véritable nom.","don de confiance");
   if(D.parole)b+=actBtn("parler-dragon","Communiquer avec Azharel","Il vous transmettra ce qu’il sait de Varek et de la forêt.","");
   b+=actBtn("ami-partir","Redescendre","Le moment passe.","");
  return `<div class="card gold"><div class="withp">${portrait("dragon",D.lien<=-2?"agacement":"indifference")}<div><div class="eyebrow">Crête de cendre · ${D.partenaire?"votre partenaire":"le pacte"}</div><h2>${D.parole?"Azharel, le dragon de la Crête":"Le dragon de la Crête"}</h2></div></div>
    <p>${esc(sc.msg)}</p>
    <p class="small muted">Autour de l'antre : des carapaces de crapauds-boucliers, des mues de guivre, et des os bien trop gros pour un cerf. Aucune trace de loup ni d'ours. Lien : ${D.lien} · prochain tribut : ${D.lien<=-2?"aucun tant qu'il est offensé":S.jour>=D.tributJour?"aujourd'hui":"jour "+D.tributJour}.</p>
    <div class="acts">${b}</div></div>`; }
function rRival(){ const R=S.rival,o=RIVAL[S.origine],force=R.op<=-2;
  return `<div class="card night"><div class="withp">${portrait(rivalKey(),humeurRival())}<div><div class="eyebrow">Une rencontre dans la nuit</div><h2>${o.nom}, ${o.qui}</h2></div></div>
  <p>${R.vu>1?"Vous le reconnaissez.":acad()?"Un aventurier, de ceux que l'académie méprise. Il vous a vu sortir.":"Une académicienne, de ceux qui ont eu ce qu'on vous a refusé. Elle vous a vu dans la cour d'armes."} Son opinion de vous : <b>${opNom(R.op)}</b>.</p>
  ${R.mepris?`<p class="small" style="color:var(--ok)">Il vous méprise depuis votre dernier duel : sa garde sera basse.</p>`:""}
  ${R.jmepris?`<p class="small" style="color:var(--bad)">Vous le sous-estimez depuis votre victoire facile : votre garde sera basse.</p>`:""}
  <p class="small muted">En duel, ce qui reste au vainqueur fixe le respect : sous 10 % de ses PV, un respect profond. Au-dessus de 50 %, le vainqueur méprise et le vaincu craint, puis s'entraîne.</p>
  <div class="acts">${force?actBtn("duel","Il ne vous laisse pas le choix","Le duel commence.",""):
    actBtn("ensemble","S'entraîner ensemble","Opinion +1. Une alliance naît du respect.","",R.op<=-1?"Il refuse : il vous craint, ou vous en veut.":false)+actBtn("duel","Le provoquer en duel","Personne ne meurt. Mais chacun se souviendra.","")+actBtn("eviter","Passer votre chemin","Rien ne change.","")}</div></div>`; }

function rAntre(){ const e=S.scene.e,D=S.dragon; let b="";
  if(e==="chasse"||e==="parti") b=actBtn("fouiller","Fouiller l'antre",e==="parti"?"Il ne reviendra pas aujourd'hui.":`Il peut revenir à tout moment (risque : ${Math.round(clamp(.25*(D.fouilles+1),0,.75)*100)} %).`,"")+actBtn("rebrousser","Redescendre","Vous gardez ce que vous avez appris en chemin.","");
  else if(e.startsWith("endormi")) b=actBtn("engager","Approcher sans bruit","Vous pourrez l'observer, le frapper par surprise, ou repartir.","")+actBtn("rebrousser","Redescendre","Vous gardez ce que vous avez appris en chemin.","");
  else b=actBtn("engager","Entrer et l'affronter",D.mefiance>=2?"Il se battra sérieusement dès le premier instant.":"Il ne vous prend pas au sérieux. Pour l'instant.","")+actBtn("rebrousser","Rebrousser chemin","Il vous regarde partir. Vous gardez ce que vous avez appris.","");
  if(!acad()&&e.includes("blesse")&&!D.confiance) b=actBtn("soin","Le soigner",D.soins===0?`Une herbe d'Hilda sur la plaie. Vous ne savez pas comment il le prendra : il peut vous chasser (risque ${Math.round(chanceChasse()*100)} %, selon sa méfiance et les bêtes qui vous accompagnent).`:"Il a déjà senti vos mains une fois. Un second soin est une manière de pacte.","1 herbe",S.herbes?false:"Il vous faut une herbe d'Hilda.")+b;
  return `<div class="card"><div class="withp">${e==="chasse"||e==="parti"?"":portrait("dragon",humeurDragon())}<div><div class="eyebrow">Crête de cendre · lecture du danger</div><h2 style="color:var(--ember)">${ETATS[e]}</h2></div></div>
    <p>${e==="blesse"||e==="endormi-blesse"?"Du sang frais sur la roche, une aile qui traîne. Il a perdu près d'un tiers de ses forces pour aujourd'hui.":e==="chasse"?"Des os, de la cendre tiède, et personne.":e==="parti"?"Le toit est arraché. Il n'y a plus de gardien.":e==="endormi"?"Une montagne d'écailles qui respire lentement.":"Il est là, lové sur son or, un œil ouvert sur l'entrée."}</p>
    <p class="small muted">Dragon : niveau 150, ${pc(D.pv,DRAGON.pvMax)} % de ses forces. Vous : niveau ${S.niv}. ${D.faible?"Vous connaissez son point faible.":"Sans connaître son point faible, vos coups ne feront presque rien."} Entamé de ${Math.round(DRAGON.recule*100)} % dans un combat, il cherchera à fuir : vous pourrez le laisser partir ou lui barrer la route.</p>
    <div class="acts">${b}</div></div>`; }

const HUMEURS={neutre:"Froid",mefiance:"Méfiant",colere:"Colère contenue",indifference:"Indifférent",agacement:"Agacé",agressivite:"Agressif"};
const HUM_SEL={neutre:"Réservée",mefiance:"Méfiante",respect:"Respect"};
const HUM_KAEL={neutre:"Narquois",mefiance:"Méfiant",confiance:"Confiant"};
function humeurRival(c){ const op=S.rival.op; return op>=2?(acad()?"confiance":"respect"):(op<=-1||c)?"mefiance":"neutre"; }
const rivalKey=()=>acad()?"kael":"selena";
const HUM_ILVA={neutre:"Préoccupée",mefiance:"Méfiante",confiance:"Confiante"};
function humeurDragon(c){ const D=S.dragon; if(c){ if(c.choix) return "agacement"; if(c.endormi) return "indifference"; return "agressivite"; } return D.mefiance>=2?"agacement":"indifference"; }
function humeurVarek(c){ const st=S.varek.stage; if(S.varek.repris||st>=2) return "colere"; if(c&&c.pvMax&&c.pv/c.pvMax<.6) return "colere"; return st>=1?"mefiance":"neutre"; }
function portrait(nom,h){ const p=PORTRAITS[nom]; if(!p) return ""; const src=p[h]||p.neutre||p.indifference; const lib=({ilva:HUM_ILVA,selena:HUM_SEL,kael:HUM_KAEL}[nom]||HUMEURS)[h]||""; return `<div class="portrait"><img src="${src}" alt="${nom==="ilva"?"Hilda":nom==="varek"?"Varek":nom} · ${lib}"><span>${lib}</span></div>`; }
function rFort(){ const st=S.varek.stage,v=VAREK[st],V=S.varek,so=sortVarek();
  const sortTxt={relache:"Si vous tombez : il vous jugera trop faible et vous fera jeter dehors, blessé.",capture:"Si vous tombez : il vous capture.",mort:"Si vous tombez : il vous tue. Vous lui avez déjà trop pris."}[so];
  return `<div class="card"><div class="withp">${portrait("varek",humeurVarek())}<div><div class="eyebrow">Fort de Varek · lecture du danger</div><h2 style="color:var(--steel)">Varek, niveau ${varekNiv()}</h2></div></div>
    <p>${v.prep} ${V.milice?"Ivan a déjà renforcé sa milice de "+V.milice+" points.":""} ${V.repris?" Il a renforcé sa garde depuis qu'on lui reprend ses otages.":""}</p>
    ${V.captifs.length?`<p>Dans les cellules : <b>${V.captifs.map(k=>OTAGES[k]).join(", ")}</b>.</p>`:""}
    <p class="small muted">${st===0?"Il n'a entendu parler de personne.":S.varek.direct?"Il se prépare parce qu'il vous a vu de ses yeux"+(S.renom>=SEUILS[0]?", et parce que votre renom est monté jusqu'à lui.":"."):"Il s'est préparé parce que votre renom est monté jusqu'à lui."} ${acad()&&st>=1?"Il sait que vous sortez de l'académie : il en connaît les codes.":""} Vous : niveau ${S.niv}.${S.varek.faille?" Vous connaissez les rondes : sentinelles et pièges ne compteront pas.":""}${S.rival.allie||S.loup.allie||S.betes.length||S.foret.meute?" Vos alliés monteront avec vous.":""}${S.obj.dette?" Azharel vous doit une dette : son ombre passera sur Varek, et la peur fera le reste.":""}</p>
    <div class="acts">${V.captifs.length?actBtn("sauver","Libérer "+OTAGES[V.captifs[0]],(V.repris||V.reprisNuit?"La garde des cellules est renforcée : des geôliers de niveau ":"Un geôlier de niveau ")+geolierNiv()+" à passer, puis vous fuyez avec l'otage sans affronter Varek. Vos alliés montent avec vous. Si vous tombez, vous êtes capturé."+(S.moment===1?" De nuit, personne ne saura que c'était vous.":" De jour, Varek saura qui l'a défié."),S.moment===1?"anonyme":"renom +10"):""}${S.jour>=J_ASSAUT?actBtn("assaut","Lancer l'assaut sur le fort",sortTxt+" "+(attenteVarek()-relache()<=0?"Il ne vous attend pas : vous pourriez l'atteindre directement.":attenteVarek()-relache()>=2?"Il s'attend à une attaque : ses sbires, son lieutenant, puis lui.":"Il se méfie : son lieutenant veille.")+" C'est la confrontation : le battre décide du sort de Varek.","décisif",acad()&&!(S.rang===3&&soutien())?"Varek est une mission de rang S. La guilde n'y envoie qu'un rang S accompagné : une escouade (40 de renom) ou un allié reconnu. Vous êtes rang "+RANGS[S.rang].k+".":false):actBtn("defier","Défier Varek en duel",sortTxt+" S'il vous voit combattre, il se souviendra de votre style. Le battre l'humilie, mais ses hommes l'emporteront dans la tour : la confrontation viendra à partir du jour "+J_ASSAUT+".",so==="mort"?"danger de mort":"",acad()&&!(S.rang===3&&soutien())?"Varek est une mission de rang S. La guilde n'y envoie qu'un rang S accompagné : une escouade (40 de renom) ou un allié reconnu. Vous êtes rang "+RANGS[S.rang].k+"."+(S.rival.allie&&!S.feuVert?" Kael n'est pas reconnu par la guilde : il faudrait le feu vert d'Orsan.":""):false)}${actBtn("repartir","Redescendre","Vous avez vu ce que vous vouliez voir. Le moment est consommé.","")}</div></div>`; }

function rCombat(){ const c=S.scene.c,dr=c.kind==="dragon"; let b="",lecture="";
  if(dr&&c.choix==="recule") b=actBtn("c-laisser","Le laisser fuir","Le combat s'arrête. Vous avez fait reculer un dragon : toute la vallée le verra s'envoler (renom +35).","")
     +actBtn("c-barrer","Lui barrer la route","Le combat continue. Acculé, il frappe plus fort, et s'il vous abat il ne vous épargnera pas : la partie s'arrêterait. Sous "+Math.round(DRAGON.grace*100)+" % de ses forces, il demandera grâce.","danger de mort");
  else if(dr&&c.choix==="grace") b=actBtn("c-epargner","L'épargner","Un pacte : l'Œil de dragon en pendentif, et sa dette le jour où vous défierez Varek. Personne n'en saura rien.","")
     +actBtn("c-achever","L'achever","Le combat continue jusqu'au bout. À bout de forces, il frappe moins fort, mais il peut encore vous tuer. Sa mort vaut croc, griffe, œil, et un renom immense.","danger de mort");
  else if(dr&&c.endormi){ const m=[4,2.5,1.5][Math.min(S.dragon.mefiance,2)];
    b=actBtn("c-surprise","Frapper par surprise",`Un seul coup à ×${fr(m)}. Il se réveillera.`,"")
     +actBtn("c-obs","L'observer en silence",`${S.dragon.faible?"Vous connaissez déjà sa faille.":"Deux observations révèlent son point faible ("+Math.min(S.dragon.obs,2)+" / 2)."} Risque de réveil : ${Math.round((.2+.15*S.dragon.mefiance)*100)} %.`,"")
     +actBtn("c-retirer","Repartir sans bruit","Aucune conséquence.",""); }
  else { const ripo=c.riposte?"Riposte prête : coup ×"+fr(S.arme==="arc"?1.3:S.arme==="dague"?1.8:(aGarde()?K.ripG:K.rip))+".":"Un coup franc.";
    b=actBtn("c-att","Attaquer",ripo,"")
     +actBtn("c-def","Se couvrir",`Bloque ${Math.round((1-blk())*100)} % d'un coup direct ou lourd, puis riposte. Inutile contre une feinte, brisé par un brise-garde.`,"")
     +actBtn("c-esq","Esquiver",dr?"Rouler sous les flammes. Réussite : rien ne vous touche.":"Le meilleur choix contre un brise-garde. Pas de riposte.","")
     +actBtn("c-obs","Observer",dr?(S.dragon.faible?"Rien de plus à apprendre.":"Chercher son point faible ("+Math.min(S.dragon.obs,2)+" / 2)."):(c.lu?"Sa garde est déjà lue.":"Lire sa garde : vous verrez venir chacun de ses coups, +"+Math.round((K.lu-1)*100)+" % de dégâts."),"")
     +((c.chg||0)>0?actBtn("c-desespere",S.arme==="epee"?"Coup fatal":S.arme==="dague"?"Rafale écarlate":"Pluie de flèches",S.arme==="epee"?"×2, engourdit et brise sa garde.":S.arme==="dague"?"5 à 7 coups rapides.":"4 à 6 flèches.","charges : "+c.chg):"")
     +(S.arme==="arc"?["feu","glace","foudre"].filter(k=>FL()[k]>0).map(k=>actBtn("c-fl-"+k,"Flèche de "+k,BOUTIQUE[k].desc,"×"+FL()[k])).join(""):"")

     +Object.keys(ARMES).filter(w=>S.armes[w]>=0&&w!==S.arme).map(w=>actBtn("c-arme-"+w,"Passer à "+(w==="arc"?"l'arc":"la "+ARMES[w].nom.toLowerCase()),"Sans perdre le tour. "+ARMES[w].desc,"")).join("")
     +["baume","tisane"].filter(k=>S.remedes[k]>0).map(k=>actBtn("c-"+k,REMEDES[k].nom,"Rend "+(k==="baume"?40:25)+" % des PV. Prend le tour.","×"+S.remedes[k])).join("")

    <div class="gauge"><div class="lab"><span>Ses forces</span><span class="mono">${c.pv} / ${c.pvMax}</span></div><div class="bar foe"><i style="width:${pc(c.pv,c.pvMax)}%"></i></div></div>

function acquis(){ const t=S.tech,o=S.obj,F=S.foret; return [S.dragon.faible&&"L'écaille fendue",t.peau&&"Peau durcie",t.braise&&"Souffle de braise",t.instinct&&"Instinct du chasseur",t.pas&&"Pas du traqueur",t.pasNuit&&"Pas du Veilleur",t.langueDraconique&&"Écoute des Cendres",o.lameNuit&&"Lame de nuit",o.lameVarek&&"Lame de Varek",S.jv&&"Journal de Varek",o.lameOrsan&&"Lame offerte par Orsan",t.gardeApprise&&"Garde apprise",o.cuirasse&&"Cuirasse d'écaille",o.plastron&&"Plastron de rang S (Ivan)",o.croc&&"Croc de dragon",o.griffe&&"Griffe de dragon",o.oeil&&"Œil de dragon",o.coeur&&"Écaille-cœur",S.dragon.partenaire&&"Dragon partenaire",S.dragon.pacte&&"Pacte avec le dragon",o.venin&&"Lame venimeuse",S.varek.faille&&"Les rondes du fort",S.loup.allie&&"Le loup cendré",S.betes.length&&S.betes.length+" bête(s) apprivoisée(s)",F.meute&&"Protégé de la meute",F.adoube&&"Adoubé par la forêt",S.rival.allie&&RIVAL[S.origine].nom+" (allié)"].filter(Boolean); }
function archiver(){ if(!S.fin||S.fin.archive) return; S.fin.archive=true; const P=parties(),st=S.stats;
  P.push({n:(P.length?P[P.length-1].n:0)+1,o:acad()?"Académicien":"Aventurier",type:S.fin.type,jour:S.fin.jour,niv:S.niv,renom:S.renom,varek:S.fin.varek,dragon:st.dragon,guilde:st.guilde,chasse:st.chasse,nuits:st.nuits,acquis:acquis().length});

    <tbody>${P.map((p,i)=>`<tr class="${i===P.length-1?"cur":""}"><td>${p.n}</td><td>${p.o||"—"}</td><td>${p.niv}</td><td>${p.renom}</td><td>${p.varek}</td><td>${p.guilde}</td><td>${p.chasse}</td><td>${p.dragon}</td><td>${p.nuits??"—"}</td><td>${p.acquis}</td><td>${iss(p)}</td></tr>`).join("")}</tbody></table></div></div>`; }
function rRevelations(){ const C=comprehension(),n=[C.profil,C.espion,C.rupture].filter(Boolean).length,E=S.espion;

  ${lst.length?`<div><div class="eyebrow" style="margin-bottom:4px">Vos archives, à la lumière de la fin</div><ul class="plain">${lst.map(i=>`<li class="item"><span class="verite ${i.vrai?"v":"f"}">${i.vrai?"VRAI":"FAUX"}</span> ${esc(i.texte)} <span class="small muted">· ${esc(i.source)}${i.avis?" · vous "+(i.avis==="crois"?"y croyiez":"en doutiez"):""}${i.note?" · votre note : « "+esc(i.note)+" »":""}</span></li>`).join("")}</ul></div>`:""}`; }
// v0.9.6 · Clôture du banc : ce que Valdren vous laisse pour la suite.
function rHeritage(){ const C=S.convoi, V=S.varek, D=S.dragon, G=S.garnison, O=S.orsan2||{}, E=S.enquete, y=S.ysolde||{}, R=S.rdv||{};
  const L=[["La forge",pris("forgeron")?"Ivan est toujours au fort. Sans lui, ni rang A ni rang S.":S.ivanFaveur?"Ivan vous doit beaucoup : il forgera ce que vous lui rapporterez.":"Ivan forge pour Valdren, et pour vous."],
    ["Le minerai",!C?"Aucun convoi n'est passé par le Gué.":C.allie?"Bram, libéré, vous ouvre ses routes et son minerai de rang A et S.":C.bram===false?"Bram est libre. Il se souviendra de qui l'a sorti de là.":"Le minerai de Bram nourrit la milice de Varek."],
    ["La Guilde",G.sanction?"Orsan est démis. Un commandant de l'Académie tient la Guilde, sans connaître la vallée.":E&&E.issue==="blame"?"Orsan, blâmé, commande encore.":E&&E.issue==="rehabilite"?"Orsan, blanchi, commande plus sûr de lui que jamais.":O.public===true?"Orsan a dit la vérité devant ses hommes. Ils le suivent autrement.":O.issue==="achete"?"Orsan vous a acheté. Vous vous tenez l'un l'autre.":"Orsan commande. Sa confiance en vous : "+G.relation+"."],
    ["Varek",(R.pacte?"Vous avez traité avec lui. ":"")+(V.vaincu?"Il ne menace plus Valdren.":"Il est toujours là, quelque part au nord.")],
    ["Ysolde",y.papiers?"Elle vous a confié une page de son dossier. Le reste, elle le garde.":"Elle garde ses papiers, et ses souvenirs."],
    ["Le dragon",D.parole?"Azharel est parti avertir les siens. Vous savez ce qu'est un Morghal, et qu'une guerre des Failles a déjà eu lieu.":D.pacte?"Le dragon de la Crête vous est lié.":D.mort?"Le dragon est mort. Ce qu'il savait est mort avec lui.":"Le dragon reste une énigme."],
    ["La bête des bois noirs",S.camp.morghalVaincu?"Vaincue. Ce n'était qu'un animal de son espèce.":"Elle rôde toujours."]];
  return `<div class="learn"><b>Ce que Valdren vous laisse</b><dl class="kv" style="font-size:.92rem">${L.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>

  <p class="small muted">Fin du banc d'essai de Valdren. Les Chroniques des Failles reprendront ailleurs.</p></div>`; }
